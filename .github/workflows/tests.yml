name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      CUDA_VISIBLE_DEVICES: ""
      PYTHONHASHSEED: "42"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
      - name: Validate release files
        run: python scripts/check_release.py
      - name: Fetch pinned third-party sources
        run: python scripts/fetch_vendor.py
      - name: Test
        run: python -m pytest -q
      - name: Run synthetic example
        run: python -m examples.event_sets
      - name: Check whitespace
        run: git diff --check
