# Checkpoint registry. HEIR baselines are trained with the recipes in models/<model>; place the final checkpoint in
# checkpoint_dir under the listed file name (released = false: no download). V-COCO baselines use the authors' official
# checkpoints.

[qpic_r50_heir]
model = "QPIC (ResNet-50)"
file = "qpic_r50_heir.pth"
released = false   # train with the recipe in models/

[qpic_r101_heir]
model = "QPIC (ResNet-101)"
file = "qpic_r101_heir.pth"
released = false   # train with the recipe in models/

[muren_heir]
model = "MUREN"
file = "muren_heir.pth"
released = false   # train with the recipe in models/

[gen_vlkt_s_heir]
model = "GEN-VLKT-S"
file = "gen_vlkt_s_heir.pth"
released = false   # train with the recipe in models/

[gen_vlkt_l_heir]
model = "GEN-VLKT-L"
file = "gen_vlkt_l_heir.pth"
released = false   # train with the recipe in models/

[rlipv2_swint_heir]
model = "RLIPv2 (Swin-T)"
file = "rlipv2_swint_heir.pth"
released = false   # train with the recipe in models/

[rlipv2_swinl_heir]
model = "RLIPv2 (Swin-L)"
file = "rlipv2_swinl_heir.pth"
released = false   # train with the recipe in models/

[sov_stg_s_heir]
model = "SOV-STG-S"
file = "sov_stg_s_heir.pth"
released = false   # train with the recipe in models/

[sov_stg_l_heir]
model = "SOV-STG-L (ResNet-101)"
file = "sov_stg_l_heir.pth"
released = false   # train with the recipe in models/

[sov_stg_swinl_heir]
model = "SOV-STG (Swin-L)"
file = "sov_stg_swinl_heir.pth"
released = false   # train with the recipe in models/

[sov_stg_vla_s_heir]
model = "SOV-STG-VLA-S"
file = "sov_stg_vla_s_heir.pth"
released = false   # train with the recipe in models/

# HEIR assets used with CoRISP and the baselines. Set their local paths in configs/paths.toml or as in the commands of
# configs/heir/corisp.toml.

[heir_support]
model = "HEIR support table (10,072 action--noun--role combinations)"
file = "heir_support.csv"

[corisp_heir_detector]
model = "CoRISP HEIR detector (H-DETR Swin-L)"
file = "heir_detector.pth"

[corisp_heir_prototypes]
model = "CoRISP HEIR DINO.txt prototypes"
file = "heir_prototypes.pt"

[corisp_heir_compatibility]
model = "CoRISP HEIR compatibility inventory"
file = "compatibility.json"

# V-COCO: official checkpoints released by the upstream authors (not redistributed here).

