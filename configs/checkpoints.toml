# Checkpoint registry. Only CoRISP weights and the HEIR assets below are published by us (Google Drive).
# HEIR baselines are trained with the recipes in models/<model>; place the final checkpoint in checkpoint_dir under
# the listed file name (released = false: no download, no checksum). V-COCO baselines use the authors' official
# checkpoints, verified by SHA-256.

