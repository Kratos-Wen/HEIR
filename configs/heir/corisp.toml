name = "CoRISP (HEIR)"
family = "corisp"
checkpoint = "corisp_heir"   # entry in configs/checkpoints.toml (TODO: released from the CoRISP training cluster)
# CoRISP is evaluated from the main branch of this repository (docs/REPRODUCTION.md there), at this commit:
repository = "https://github.com/Kratos-Wen/HEIR"
commit = "42327eced7b28ee7dcab3af67ba0634dcb92bfb4"
assets = ["CORISP_WEIGHTS", "HEIR_DETECTOR", "HEIR_PROTOTYPES", "HEIR_COMPATIBILITY"]
# released files: corisp_heir_detector, corisp_heir_prototypes, corisp_heir_compatibility in configs/checkpoints.toml;
# CORISP_WEIGHTS holds the public DINOv3 and DINO.txt weights listed in main configs/required_assets.json.
predict = "python -m corisp_heir.predict --data $HEIR_DATA --split test --detector $HEIR_DETECTOR --prototypes $HEIR_PROTOTYPES --compatibility $HEIR_COMPATIBILITY --checkpoint $CORISP_CHECKPOINT --output outputs/heir/test.jsonl"
score_sets = "python -m evaluation.heir_sets --annotations $HEIR_DATA/annotations/test.json --vocabulary $HEIR_DATA/vocabulary.json --predictions outputs/heir/test.jsonl --output outputs/heir/set_metrics.json"
metrics = ["role", "hoi", "sets-map"]
